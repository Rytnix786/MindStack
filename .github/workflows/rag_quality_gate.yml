name: RAG Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Pull Ollama model
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve &
          sleep 5
          ollama pull mistral
          
      - name: Add sample documents for CI
        run: |
          echo "This is a test document for CI evaluation. 
          The refund policy allows returns within 30 days.
          Customers must contact support@company.com for refunds.
          Enterprise customers get priority support." > data/ci_test_doc.txt
          
      - name: Run ingestion
        run: python -m src.ingestion
        
      - name: Run evaluation
        env:
          OLLAMA_BASE_URL: http://localhost:11434
          EVAL_REFUSAL_ACCURACY_THRESHOLD: "0.25"
        run: python evals/evaluate.py
        
      - name: Check quality thresholds
        run: python evals/check_thresholds.py
        
      - name: Upload eval results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-results
          path: evals/eval_results.json

  test-api:
    runs-on: ubuntu-latest
    needs: quality-gate
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          
      - name: Install dependencies
        run: pip install -r requirements.txt
        
      - name: Pull Ollama and start server
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve &
          sleep 5
          ollama pull mistral
          
      - name: Ingest test documents
        run: |
          echo "Test document content for API testing." > data/api_test_doc.txt
          python -m src.ingestion
          
      - name: Start API server
        run: |
          python -m uvicorn src.api:app --host 0.0.0.0 --port 8000 > api-server.log 2>&1 &
        
      - name: Wait for server
        run: |
          for i in {1..30}; do
            if curl -fsS http://localhost:8000/health >/dev/null; then
              echo "API is healthy"
              exit 0
            fi
            sleep 2
          done
          echo "API failed to become healthy in time"
          cat api-server.log || true
          exit 1
        
      - name: Health check
        run: curl -f http://localhost:8000/health
        
      - name: Test query endpoint
        run: |
          RESPONSE=$(curl -s -X POST http://localhost:8000/query \
            -H "Content-Type: application/json" \
            -d '{"query": "What is the refund policy?"}')
          echo $RESPONSE
          echo $RESPONSE | python -c "
          import sys, json
          data = json.load(sys.stdin)
          assert 'answer' in data, 'Missing answer field'
          assert 'citations' in data, 'Missing citations field'
          assert 'answer_grounded' in data, 'Missing answer_grounded field'
          print('API test passed')
          "
          
      - name: Test metrics endpoint
        run: curl -f http://localhost:8000/metrics

      - name: Upload API server logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-server-log
          path: api-server.log
